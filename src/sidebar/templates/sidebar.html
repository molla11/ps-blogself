<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>PS-Blogself</title>
        <meta http-equiv="Content-Security-Policy" content="{{csp}}" />
        <link href="{{codiconsUri}}" rel="stylesheet" />
        <!-- {{css}} -->
    </head>
    <body>
        <section id="service-notices" aria-label="서비스 공지" aria-live="polite" hidden></section>
        <div id="main-view" class="view-container">
            <div class="config-section">
                <div class="config-box">
                    <div class="config-info">
                        <span class="config-title">기록 상태</span>
                        <span id="recording-status-text" class="config-subtitle">대기 중</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="recording-toggle" aria-label="변경 기록" />
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="config-box vertical">
                    <div class="config-info">
                        <span class="config-title">대상 확장자</span>
                        <span id="lang-status-text" class="config-subtitle"
                            >현재: .c, .cpp, .py</span
                        >
                    </div>
                    <div class="language-group">
                        <div class="lang-chip" data-lang="c">C</div>
                        <div class="lang-chip" data-lang="cpp">C++</div>
                        <div class="lang-chip" data-lang="py">Python</div>
                    </div>
                </div>

                <div class="current-status">
                    <span class="config-title">활성 경로</span>
                    <span id="window-root-label" class="config-subtitle" title="이 창에만 적용됩니다. 창을 닫거나 다시 불러오면 작업 공간의 저장된 경로로 돌아갑니다." hidden>이 창</span>
                    <div class="path-field">
                        <div class="path-control">
                            <button id="root-folder-btn" class="path-trigger" type="button" aria-label="활성 경로 선택" aria-haspopup="menu" aria-expanded="false" aria-controls="path-menu">
                                <span class="path-ellipsis" dir="rtl"><bdi id="root-folder-display" dir="ltr">현재 열려있는 모든 파일</bdi></span>
                                <i class="codicon codicon-chevron-down" aria-hidden="true"></i>
                            </button>
                            <span class="path-reset">
                                <button id="clear-folder-btn" type="button" aria-label="활성 경로 재설정" aria-describedby="path-reset-tooltip">
                                    <i class="codicon codicon-discard" aria-hidden="true"></i>
                                </button>
                                <span id="path-reset-tooltip" class="path-tooltip" role="tooltip">활성 경로 재설정</span>
                            </span>
                        </div>
                        <div id="path-menu" role="menu" aria-label="활성 경로" hidden>
                            <button id="select-folder-btn" class="menu-item" type="button" role="menuitem" tabindex="-1" data-path-action="selectRootFolder">디렉토리 직접 선택</button>
                            <button id="use-ws-root-btn" class="menu-item" type="button" role="menuitem" tabindex="-1" data-path-action="useWorkspaceRoot" disabled>
                                <span class="path-ellipsis" dir="rtl"><bdi id="current-directory-label" dir="ltr">열린 작업 폴더 없음</bdi></span>
                                <span class="path-suffix" hidden>로 설정</span>
                            </button>
                        </div>
                    </div>
                    <div id="root-folder-hint" class="hint" hidden>
                        <span>활성 경로 밖의 파일 수정은 기록하지 않습니다.</span>
                    </div>
                </div>
            </div>

            <!-- Recent Logs Section -->
            <div class="logs-section">
                <div class="logs-title">
                    <span id="recent-logs-title">최근 변경 기록</span>
                    <button id="toggle-logs-search-btn" class="logs-search-toggle" type="button" title="기록 검색" aria-label="기록 검색" aria-expanded="false" aria-controls="logs-search">
                        <i class="codicon codicon-search" aria-hidden="true"></i>
                    </button>
                </div>
                <div id="logs-search" class="logs-search" role="search" aria-label="변경 기록 검색" hidden>
                    <input id="logs-search-input" type="search" placeholder="파일명 또는 경로 검색" aria-label="파일명 또는 경로 검색" autocomplete="off" spellcheck="false" />
                </div>
                <div id="logs-container" class="logs-container" role="group" aria-labelledby="recent-logs-title">
                    <div class="empty-logs">기록된 변경 사항이 없습니다.</div>
                    <div id="recent-logs-loader" class="logs-loader" hidden>
                        <span id="recent-logs-status" role="status" aria-live="polite"></span>
                        <button id="retry-logs-btn" class="secondary" hidden>다시 불러오기</button>
                    </div>
                </div>
            </div>

            <footer class="sidebar-actions" aria-label="사용량 및 글쓰기">
                <button id="usage-btn" class="secondary" type="button" aria-label="서버 사용량 확인" hidden></button>
                <div class="button-group account-actions">
                    <button id="connect-server-btn" class="secondary" title="계정 및 사용량"><span class="account-action-label">로그인</span></button>
                    <button id="sample-btn" class="secondary"><span class="account-action-label">샘플로 시작</span></button>
                </div>
                <div class="bottom-actions">
                    <button id="manage-logs-btn" class="action-btn secondary">
                        <span class="icon">📜</span>
                        <span>전체 기록</span>
                    </button>
                    <button id="generate-blog-btn" class="action-btn">
                        <span class="icon">✨</span>
                        <span>글 만들기</span>
                    </button>
                </div>
            </footer>
        </div>

        <!-- Full Logs View -->
        <div id="full-logs-view" class="view-container hidden">
            <div class="header-bar">
                <button id="full-logs-back-btn" class="back-btn" title="Back">
                    <i class="codicon codicon-arrow-left"></i>
                </button>
                <span class="header-title">전체 코드 기록 관리</span>
            </div>
            <div class="logs-section">
                <div id="full-logs-container" class="logs-container">
                    <!-- Logs here -->
                </div>
            </div>
        </div>

        <div id="context-menu" role="menu" aria-label="파일 작업" hidden>
            <button type="button" class="menu-item" role="menuitem" tabindex="-1" id="ctx-open-file" data-action="openFile">파일 열기</button>
            <button type="button" class="menu-item" role="menuitem" tabindex="-1" id="ctx-view-history" data-action="viewHistory">수정 기록 보기</button>
            <button type="button" class="menu-item" role="menuitem" tabindex="-1" id="ctx-write-blog" data-action="selectLogForBlog">글쓰기</button>
        </div>

        {{js}}
    </body>
</html>
