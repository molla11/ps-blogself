<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>PS-Blogself</title>
        <meta http-equiv="Content-Security-Policy" content="{{csp}}" />
        <link href="{{codiconsUri}}" rel="stylesheet" />
        <!-- {{css}} -->
    </head>
    <body class="{{contestClass}}">
        <section id="service-notices" aria-label="서비스 공지" aria-live="polite" hidden></section>
        <div id="main-view" class="view-container">
            <button id="sidebar-home-btn" class="back-btn" type="button" hidden>
                <i class="codicon codicon-arrow-left" aria-hidden="true"></i><span>처음 화면</span>
            </button>
            <section id="writer-tools" aria-label="글쓰기 도구" hidden>
                <div class="writer-heading">
                    <h2 id="writer-file-name"></h2>
                    <span id="side-save-status" role="status"></span>
                </div>
                <span id="side-sync-status" class="writer-hint" role="status" hidden></span>
                <button class="secondary" data-writer-action="viewSyncFailures" type="button" hidden>실패한 버전 보기</button>
                <div class="writer-options">
                    <div id="writer-plan-options">
                        <label class="writer-field"><span id="side-mode-label">구성</span><select id="side-mode" data-writer-action="mode" aria-labelledby="side-mode-label"></select></label>
                        <label class="writer-field">문체<select id="side-style" data-writer-action="style"></select></label>
                    </div>
                    <label class="writer-field">모델<select id="side-model" data-writer-action="model" aria-describedby="side-model-hint"></select></label>
                    <p class="writer-hint" id="side-model-hint" role="status" hidden></p>
                </div>
                <div class="writer-actions">
                    <button class="secondary" data-writer-action="prepare" type="button">메모 생성</button>
                    <button data-writer-action="generate" type="button">글쓰기</button>
                    <button data-writer-action="cancelWrite" type="button" class="secondary" hidden>글 작성 취소</button>
                </div>
                <div id="writer-article-options" hidden>
                    <div class="writer-view-modes" id="side-view-modes" role="group" aria-label="본문 보기 방식" hidden>
                        <button data-writer-action="edit" type="button" aria-pressed="true">편집</button>
                        <button data-writer-action="source" type="button" aria-pressed="false">Markdown</button>
                        <button data-writer-action="preview" type="button" aria-pressed="false">미리보기</button>
                    </div>
                    <div id="side-history">
                        <div class="writer-versions">
                            <label class="writer-field">글 버전<select id="side-version" data-writer-action="version"></select></label>
                            <button class="secondary" data-writer-action="older" type="button" aria-label="이전 버전" title="이전 버전">‹</button>
                            <button class="secondary" data-writer-action="newer" type="button" aria-label="다음 버전" title="다음 버전">›</button>
                        </div>
                        <button class="secondary" data-writer-action="restore" type="button" hidden>이 버전 사용</button>
                    </div>
                    <details class="writer-disclosure" id="side-outline">
                        <summary>목차</summary>
                        <div id="side-outline-list"></div>
                        <p class="writer-hint" id="side-outline-empty">본문에 제목을 넣으면 여기에 표시됩니다.</p>
                    </details>
                    <details class="writer-disclosure" id="side-export">
                        <summary>내보내기</summary>
                        <div class="writer-export-bar">
                            <div class="writer-export-actions" id="side-file-actions" role="group" aria-label="파일 저장 및 복사">
                                <button type="button" data-writer-action="export-btn"><i class="codicon codicon-markdown" aria-hidden="true"></i></button>
                                <button type="button" data-writer-action="export-html-btn"><i class="codicon codicon-file-code" aria-hidden="true"></i></button>
                                <button type="button" data-writer-action="copy-btn"><i class="codicon codicon-copy" aria-hidden="true"></i></button>
                            </div>
                            <div class="writer-export-actions" id="side-ghost-actions" role="group" aria-label="Ghost">
                                <button type="button" data-writer-action="ghost-connect-btn">
                                    <!-- Ghost mark from Simple Icons (CC0). -->
                                    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm.256 2.313c2.47.005 5.116 2.008 5.898 2.962l.244.3c1.64 1.994 3.569 4.34 3.569 6.966 0 3.719-2.98 5.808-6.158 7.508-1.433.766-2.98 1.508-4.748 1.508-4.543 0-8.366-3.569-8.366-8.112 0-.706.17-1.425.342-2.15.122-.515.244-1.033.307-1.549.548-4.539 2.967-6.795 8.422-7.408a4.29 4.29 0 01.49-.026Z"/></svg>
                                </button>
                                <button type="button" data-writer-action="ghost-save-btn"><i class="codicon codicon-save" aria-hidden="true"></i></button>
                                <button type="button" data-writer-action="ghost-publish-btn"><i class="codicon codicon-cloud-upload" aria-hidden="true"></i></button>
                                <button type="button" data-writer-action="ghost-open-btn"><i class="codicon codicon-link-external" aria-hidden="true"></i></button>
                            </div>
                        </div>
                        <p class="writer-hint"><a href="https://ps-blogself.shinem.dev/browser-extension">브라우저 확장 설치 안내</a></p>
                    </details>
                    <p class="writer-hint" id="side-ghost-status" role="status" hidden></p>
                </div>
            </section>
            <div class="config-section">
                <div class="config-box">
                    <div class="config-info">
                        <span class="config-title">기록 상태</span>
                        <span id="recording-status-text" class="config-subtitle">대기 중</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="recording-toggle" aria-label="변경 기록" />
                        <span class="slider"></span>
                    </label>
                </div>

                <label class="config-box">
                    <span class="config-title">대회 모드</span>
                    <span class="switch">
                        <input type="checkbox" role="switch" id="enter-contest" />
                        <span class="slider"></span>
                    </span>
                </label>

                <div class="config-box vertical">
                    <div class="config-info">
                        <span class="config-title">대상 확장자</span>
                        <span id="lang-status-text" class="config-subtitle"
                            >현재: .c, .cpp, .py</span
                        >
                    </div>
                    <div class="language-group">
                        <div class="lang-chip" data-lang="c">C</div>
                        <div class="lang-chip" data-lang="cpp">C++</div>
                        <div class="lang-chip" data-lang="py">Python</div>
                    </div>
                </div>

                <div class="current-status">
                    <span class="config-title">활성 경로</span>
                    <span id="window-root-label" class="config-subtitle" title="이 창에만 적용됩니다. 창을 닫거나 다시 불러오면 작업 공간의 저장된 경로로 돌아갑니다." hidden>이 창</span>
                    <div class="path-field">
                        <div class="path-control">
                            <button id="root-folder-btn" class="path-trigger" type="button" aria-label="활성 경로 선택" aria-haspopup="menu" aria-expanded="false" aria-controls="path-menu">
                                <span class="path-ellipsis" dir="rtl"><bdi id="root-folder-display" dir="ltr">현재 열려있는 모든 파일</bdi></span>
                                <i class="codicon codicon-chevron-down" aria-hidden="true"></i>
                            </button>
                            <span class="path-reset">
                                <button id="clear-folder-btn" type="button" aria-label="활성 경로 재설정" aria-describedby="path-reset-tooltip">
                                    <i class="codicon codicon-discard" aria-hidden="true"></i>
                                </button>
                                <span id="path-reset-tooltip" class="path-tooltip" role="tooltip">활성 경로 재설정</span>
                            </span>
                        </div>
                        <div id="path-menu" role="menu" aria-label="활성 경로" hidden>
                            <button id="select-folder-btn" class="menu-item" type="button" role="menuitem" tabindex="-1" data-path-action="selectRootFolder">디렉토리 직접 선택</button>
                            <button id="use-ws-root-btn" class="menu-item" type="button" role="menuitem" tabindex="-1" data-path-action="useWorkspaceRoot" disabled>
                                <span class="path-ellipsis" dir="rtl"><bdi id="current-directory-label" dir="ltr">열린 작업 폴더 없음</bdi></span>
                                <span class="path-suffix" hidden>로 설정</span>
                            </button>
                        </div>
                    </div>
                    <div id="root-folder-hint" class="hint" hidden>
                        <span>활성 경로 밖의 파일 수정은 기록하지 않습니다.</span>
                    </div>
                </div>
            </div>

            <!-- Recent Logs Section -->
            <button type="button" id="library-toggle" aria-controls="file-library" aria-expanded="true" hidden>
                <i class="codicon codicon-chevron-up" aria-hidden="true"></i>코드 파일
            </button>
            <div class="logs-section" id="file-library">
                <div class="logs-title">
                    <span id="recent-logs-title">코드 파일</span>
                    <button id="manage-logs-btn" class="logs-toolbar-button" type="button" title="전체 기록" aria-label="전체 기록">
                        <i class="codicon codicon-history" aria-hidden="true"></i>
                    </button>
                    <button id="toggle-logs-search-btn" class="logs-toolbar-button" type="button" title="코드 파일 검색" aria-label="코드 파일 검색" aria-expanded="false" aria-controls="logs-search">
                        <i class="codicon codicon-search" aria-hidden="true"></i>
                    </button>
                </div>
                <div id="logs-search" class="logs-search" role="search" aria-label="코드 파일 검색" hidden>
                    <input id="logs-search-input" type="search" placeholder="파일명 또는 경로 검색" aria-label="파일명 또는 경로 검색" autocomplete="off" spellcheck="false" />
                </div>
                <div id="logs-container" class="logs-container" role="group" aria-labelledby="recent-logs-title">
                    <div class="empty-logs">코드 파일을 찾는 중…</div>
                    <div id="empty-code-actions" hidden>
                        <button type="button" id="open-code-folder" title="폴더 열기"><i class="codicon codicon-folder-opened" aria-hidden="true"></i><span>폴더를 열면 코드 수정을 자동으로 기록합니다.</span></button>
                        <button type="button" id="create-code-file" hidden>이 폴더에 코드 파일 만들기</button>
                    </div>
                    <div id="recent-logs-loader" class="logs-loader" hidden>
                        <span id="recent-logs-status" role="status" aria-live="polite"></span>
                        <button id="retry-logs-btn" class="secondary" hidden>다시 불러오기</button>
                    </div>
                </div>
            </div>

            <div id="recording-failure" role="status" hidden><span></span> <button type="button" class="secondary" id="retry-recording">다시 저장</button></div>
            <footer class="sidebar-actions" aria-label="사용량 및 글쓰기">
                <hr class="account-divider">
                <button id="connect-server-btn" class="secondary" title="계정 및 사용량"><span class="account-action-label">로그인</span></button>
                <div class="bottom-actions">
                    <button id="usage-btn" type="button" aria-description="사용량 상세 보기" hidden>
                        <span id="usage-label">
                            <span id="usage-free"></span>
                            <span id="usage-reset" hidden></span>
                            <span id="usage-paid" hidden></span>
                        </span>
                        <i class="codicon codicon-chevron-right" aria-hidden="true" hidden></i>
                    </button>
                    <button id="generate-blog-btn" class="action-btn" type="button" disabled>글 만들기</button>
                </div>
            </footer>
        </div>

        <section id="contest-view" class="view-container" aria-label="대회 모드">
            <div class="contest-controls" hidden>
                <label class="config-box">
                    <span class="config-title">온라인 요청 차단</span>
                    <span class="switch"><input type="checkbox" role="switch" data-contest-option="backend" checked /><span class="slider"></span></span>
                </label>
                <label class="config-box">
                    <span class="config-title">글쓰기 화면 진입 차단</span>
                    <span class="switch"><input type="checkbox" role="switch" data-contest-option="writing" checked /><span class="slider"></span></span>
                </label>
                <label class="config-box">
                    <span class="config-title">수정사항 로컬 로깅 차단</span>
                    <span class="switch"><input type="checkbox" role="switch" data-contest-option="recording" /><span class="slider"></span></span>
                </label>
                <button id="exit-contest" type="button">대회 모드 나가기 <span aria-hidden="true">→</span></button>
            </div>
        </section>

        <!-- Full Logs View -->
        <div id="full-logs-view" class="view-container hidden">
            <div class="header-bar">
                <button id="full-logs-back-btn" class="back-btn" type="button">
                    <i class="codicon codicon-arrow-left" aria-hidden="true"></i><span>처음 화면</span>
                </button>
                <span class="header-title">전체 코드 기록 관리</span>
            </div>
            <div class="logs-section">
                <div id="full-logs-container" class="logs-container">
                    <!-- Logs here -->
                </div>
            </div>
        </div>

        <div id="context-menu" role="menu" aria-label="파일 작업" hidden>
            <button type="button" class="menu-item" role="menuitem" tabindex="-1" id="ctx-open-file" data-action="openFile">파일 열기</button>
            <button type="button" class="menu-item" role="menuitem" tabindex="-1" id="ctx-view-history" data-action="viewHistory">수정 기록 보기</button>
            <button type="button" class="menu-item" role="menuitem" tabindex="-1" id="ctx-write-blog" data-action="selectLogForBlog">글쓰기</button>
        </div>

        {{js}}
    </body>
</html>
