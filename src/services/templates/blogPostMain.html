<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="Content-Security-Policy" content="{{csp}}" />
        <title>글 만들기</title>
        {{styles}}
    </head>
    <body>
        <header class="topbar">
            <div>
                <span class="eyebrow" id="file-name">풀이 기록</span>
                <h1>글 만들기</h1>
            </div>
            <div class="actions">
                <span id="save-status" role="status"></span
                ><button id="generate-btn" disabled>이대로 글쓰기</button>
            </div>
        </header>
        <main>
            <div class="notice" id="ownership-box" role="status" hidden>
                <span>다른 창에서 편집 중입니다. 최신 내용을 함께 보고 있어요.</span>
                <button class="secondary" id="takeover-btn">이 창에서 편집</button>
            </div>
            <div class="notice" id="recovery-box" hidden>
                <span>이 창의 미저장 입력을 보관하고 있습니다.</span>
                <button class="secondary" id="recover-input-btn">미저장 입력 적용</button>
            </div>
            <div class="notice" id="progress-box" role="status">
                <span id="status-text">기록을 불러오고 있어요…</span
                ><button class="quiet" id="cancel-btn" hidden>취소</button
                ><progress id="progress" max="100" hidden></progress>
            </div>
            <div class="notice error" id="error-box" role="alert" hidden>
                <span id="error-text"></span>
                <div class="actions">
                    <button id="retry-btn">다시 시도</button
                    ><button class="secondary" id="connect-btn">로그인 / AI 설정</button
                    ><button class="quiet" id="discard-pending-btn" hidden>새 요청 준비</button>
                </div>
            </div>
            <div class="notice" id="candidate-box" hidden>
                <span>새 결과가 준비됐어요. 적용하면 현재 내용이 바뀝니다.</span>
                <div class="actions">
                    <button id="apply-candidate-btn">새 결과 적용</button
                    ><button class="quiet" id="discard-candidate-btn">현재 내용 유지</button>
                </div>
            </div>
            <nav id="view-tabs" hidden aria-label="글 작성 화면">
                <button class="tab active" id="plan-tab">풀이 흐름</button
                ><button class="tab" id="article-tab">완성된 글</button>
            </nav>
            <section id="stream-box" hidden>
                <h2>작성 중인 글</h2>
                <article id="stream-preview" class="article-preview" aria-label="작성 중인 본문"></article>
            </section>
            <section id="plan-view">
                <div id="preparing">
                    <div class="skeleton"></div>
                    <div class="skeleton short"></div>
                    <p>변경 구간과 풀이 설명을 먼저 채워드릴게요.</p>
                    <button id="prepare-empty-btn" class="secondary" hidden>풀이 준비</button>
                </div>
                <div id="plan-content" hidden>
                    <div class="section-heading">
                        <h2>글에 담을 흐름</h2>
                        <button class="quiet" id="prepare-btn">다시 분석</button>
                    </div>
                    <details class="range-box" id="range-details">
                        <summary>
                            <span id="range-info"></span><span class="muted">범위 조정</span>
                        </summary>
                        <div class="timeline" id="timeline" aria-hidden="true">
                            <div id="timeline-range"></div>
                        </div>
                        <div class="range-controls">
                            <label
                                >시작 <input id="range-start" type="range" min="0" max="0" /><output
                                    id="start-label"
                                ></output></label
                            ><label
                                >끝 <input id="range-end" type="range" min="0" max="0" /><output
                                    id="end-label"
                                ></output
                            ></label>
                        </div>
                        <div id="range-changes" class="range-changes"></div>
                    </details>
                    <label class="field"
                        >글 제목<input id="plan-title" maxlength="300" placeholder="글 제목"
                    /></label>
                    <label class="field"
                        >전체 설명<textarea
                            id="summary"
                            rows="3"
                            maxlength="12000"
                            placeholder="풀이의 전체 흐름"
                        ></textarea>
                    </label>
                    <div id="steps"></div>
                </div>
                <label class="field" for="writing-style">문체
                    <select id="writing-style">
                        <option value="plain">했다/이다체 (기본)</option>
                        <option value="formal">합니다체</option>
                        <option value="friendly">해요체</option>
                        <option value="notes">간결한 메모체</option>
                        <option value="custom">사용자 지정</option>
                    </select>
                </label>
                <label class="field" id="custom-style-field" hidden>원하는 문체
                    <textarea id="custom-style" rows="2" maxlength="2000"
                        placeholder="예: 짧고 담백한 했다체로, 처음 배우는 사람도 이해할 수 있게. 비워두면 했다/이다체를 사용해요."></textarea>
                </label>
                <label class="field extra"
                    >추가로 담고 싶은 내용 <span class="muted">선택 사항</span
                    ><textarea
                        id="instructions"
                        rows="2"
                        maxlength="12000"
                        placeholder="문제 설명이나 원하는 글의 분위기를 적어도 좋아요."
                    ></textarea>
                </label>
            </section>
            <section id="article-view" hidden>
                <div class="section-heading">
                    <h2>완성된 글</h2>
                    <div class="actions">
                        <button class="secondary" id="preview-btn">미리보기</button
                        ><button class="secondary" id="copy-btn">복사</button
                        ><button id="export-btn">Markdown 저장</button>
                    </div>
                </div>
                <label class="field">글 제목<input id="article-title" maxlength="300" /></label>
                <label class="field" id="body-field"
                    >본문<textarea
                        id="article-body"
                        rows="18"
                        maxlength="150000"
                        spellcheck="false"
                    ></textarea>
                </label>
                <article id="article-preview" class="article-preview" hidden></article>
                <details id="versions-box" hidden>
                    <summary>이전 글</summary>
                    <div id="versions"></div>
                </details>
            </section>
        </main>
        {{script}}
    </body>
</html>
